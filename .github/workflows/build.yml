name: Build packages

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Only build this package id (empty = all)"
        default: ""
      force:
        description: "Rebuild even if this upstream release is already published"
        type: boolean
        default: false
      publish:
        description: "Create one release per package"
        type: boolean
        default: true
  schedule:
    - cron: "20 18 * * *"

concurrency:
  group: cyime-personal-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: Cyletix/CyIME

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      packages: ${{ steps.resolve.outputs.packages }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      upstream_code: ${{ steps.resolve.outputs.upstream_code }}
      skipped_packages: ${{ steps.resolve.outputs.skipped_packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate package list
        run: python3 -m py_compile scripts/*.py
      - name: Select latest official stable release and resolve package versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ID: ${{ inputs.package_id }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 scripts/prepare_build.py \
            --upstream "$UPSTREAM" \
            --repo "$GITHUB_REPOSITORY" \
            --packages packages.json \
            --package-id "$PACKAGE_ID" \
            ${{ inputs.force && '--force' || '' }} >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    name: build ${{ matrix.package.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Clone exact upstream release tag
        run: |
          git clone --depth 1 --branch "${{ needs.prepare.outputs.upstream_tag }}" \
            "https://github.com/$UPSTREAM.git" upstream
          git -C upstream submodule update --init --recursive --depth 1
          test "$(git -C upstream rev-parse HEAD)" = "${{ needs.prepare.outputs.upstream_commit }}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install NDK and native build tools
        run: |
          NDK_VERSION=$(grep -oP '^\s*ndkVersion = "\K[^"]+' upstream/app/build.gradle.kts | head -1)
          test -n "$NDK_VERSION"
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Cache ONNX runtime
        uses: actions/cache@v6
        with:
          path: |
            upstream/app/src/main/jni/onnxruntime
            upstream/app/src/main/jniLibs/**/libonnxruntime.so
          key: onnx-${{ runner.os }}-${{ needs.prepare.outputs.upstream_tag }}-${{ hashFiles('upstream/app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: onnx-${{ runner.os }}-
      - name: Download native dependencies
        working-directory: upstream
        run: ./gradlew downloadOnnx --no-daemon
      - name: Download same-release official APK for pinned libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          mkdir -p official
          gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM" \
            --pattern "CyIME-${UPSTREAM_TAG}-arm64-v8a.apk" --dir official
          test -s "official/CyIME-${UPSTREAM_TAG}-arm64-v8a.apk"
      - name: Apply minimal identity patch
        env:
          PKG_ID: ${{ matrix.package.id }}
          VERSION: ${{ matrix.package.version }}
          VERSION_CODE: ${{ matrix.package.versionCode }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
        run: |
          cp fork/signing/ci-cert-sha256.txt upstream/signing-ci-cert-sha256.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          python3 fork/scripts/patch_upstream.py upstream \
            --repo "${{ github.repository }}" \
            --packages fork/packages.json \
            --package-id "$PKG_ID" \
            --cert upstream/signing-ci-cert-sha256.txt \
            --version-name "$VERSION" \
            --version-code "$VERSION_CODE" \
            --official-apk "official/CyIME-${UPSTREAM_TAG}-arm64-v8a.apk" \
            --apksigner "$APKSIGNER" \
            --upstream-tag "$UPSTREAM_TAG" \
            --upstream-version "$UPSTREAM_VERSION"
      - name: Prepare signing properties
        run: |
          cat > upstream/app/keystore.properties <<EOF
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build release APK (ARM64)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -I scripts/phone-release-abi.gradle \
            -PcyimeReleaseAbi=arm64-v8a \
            --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp upstream/app/build/outputs/apk/release/*-arm64-v8a.apk out/
          ls -l out
      - name: Verify APK identity, version and signature
        env:
          EXPECTED_ID: ${{ matrix.package.applicationId }}
          EXPECTED_CODE: ${{ matrix.package.versionCode }}
          EXPECTED_NAME: ${{ matrix.package.version }}
          CERT_FILE: fork/signing/ci-cert-sha256.txt
        run: |
          set -euo pipefail
          APK=$(find out -name '*.apk' -type f | head -1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -F "package: name='$EXPECTED_ID'" badging.txt
          grep -F "versionCode='$EXPECTED_CODE'" badging.txt
          grep -F "versionName='$EXPECTED_NAME'" badging.txt
          if grep -Fq "application-debuggable" badging.txt; then
            echo "::error::release APK is debuggable"; exit 1
          fi
          # minSdk >= 24 makes apksigner skip v1 and report it false, so verify
          # with 23 even though the app itself requires 28 (same as upstream).
          "$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$APK" > sig.txt
          grep -Fq "Verified using v1 scheme (JAR signing): true" sig.txt || { echo "::error::no v1 signature"; exit 1; }
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" sig.txt || { echo "::error::no v2 signature"; exit 1; }
          keytool -printcert -jarfile "$APK" > cert.txt
          FP=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' cert.txt | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test -n "$FP" || { echo "::error::cannot read signing certificate"; exit 1; }
          grep -Fixq "$FP" "$CERT_FILE" || { echo "::error::unexpected signing certificate $FP"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package.id }}-${{ matrix.package.version }}
          path: out/*.apk
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    name: publish ${{ matrix.package.id }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.package.id }}-${{ matrix.package.version }}
          path: out
      - name: Publish this package's own release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
          VERSION: ${{ matrix.package.version }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
          PKG_ID: ${{ matrix.package.id }}
          PKG_APP: ${{ matrix.package.applicationId }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG appeared while building"; exit 1
          fi
          APK=$(find out -name '*.apk' -type f | head -1)
          gh release create "$TAG" "$APK" \
            --title "CyIME $VERSION ($PKG_ID)" \
            --notes-file <(printf '%s\n' \
              "非官方个人构建，跟随上游 $UPSTREAM_TAG。" \
              "" \
              "包名: $PKG_APP" \
              "" \
              "上游提交: $UPSTREAM_COMMIT" \
              "" \
              "本包只接受 ${{ matrix.package.suffix }}-v 前缀的更新。不同包名互不覆盖。")
      - name: Verify published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
          PKG_APP: ${{ matrix.package.applicationId }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,assets --jq '.assets[].name' > assets.txt
          test -s assets.txt
          grep -q '\.apk$' assets.txt
          mkdir -p downloaded
          gh release download "$TAG" --dir downloaded --pattern '*.apk'
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          APK=$(find downloaded -name '*.apk' | head -1)
          "$AAPT2" dump badging "$APK" | grep -F "package: name='$PKG_APP'"
